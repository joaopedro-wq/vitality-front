<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vitality PLUS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171410" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" href="favicon.ico" />

    <meta name="google" content="notranslate" />
    <meta name="google-translate-customization" content="disabled" />
    <meta http-equiv="Content-Language" content="pt-BR" />

    <meta name="description" content="Acompanhe metas, diário alimentar e dietas em um só lugar." />

    <meta property="og:title" content="Vitality PLUS — Nutrição e metas diárias" />
    <meta
      property="og:description"
      content="Acompanhe metas, diário alimentar e dietas em um só lugar."
    />
    <meta property="og:image" content="https://vitality-front.vercel.app/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://vitality-front.vercel.app/" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vitality PLUS — Nutrição e metas diárias" />
    <meta
      name="twitter:description"
      content="Acompanhe metas, diário alimentar e dietas em um só lugar."
    />
    <meta name="twitter:image" content="https://vitality-front.vercel.app/images/og-image.png" />

    <!-- Evita flash de tema/paleta errados antes do Angular iniciar -->
    <script>
      (function () {
        try {
          var storedLanguage = localStorage.getItem('vitality-language');
          var initialLanguage = storedLanguage === 'en-US' ? 'en-US' : 'pt-BR';
          document.documentElement.setAttribute('lang', initialLanguage);
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);

          var validPalettes = ['horta', 'especiaria', 'salvia', 'ameixa-reversa'];
          var p = localStorage.getItem('palette');
          if (validPalettes.indexOf(p) === -1) p = 'horta';
          document.documentElement.setAttribute('data-palette', p);
        } catch (e) {}
      })();
    </script>

    <style>
      .vtp-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: var(--bd-bg, #f7f1e4);
        color: var(--bd-primary, #5c7a3f);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        /* Nasce invisível e só aparece depois de 250ms — mesma regra de
         anti-flicker do resto do sistema. Sem token no localStorage, o
         `restoreSession()` resolve na hora e o splash nunca chega a pintar.
         O atraso vive no `animation-delay`, não na duração, porque a guarda
         global de prefers-reduced-motion zera durações, mas não atrasos. */
        opacity: 0;
        animation: vtp-splash-in 0.25s ease-out 0.25s forwards;
      }
      @keyframes vtp-splash-in {
        to {
          opacity: 1;
        }
      }
      .vtp-splash__legenda {
        color: var(--bd-fg-muted, #786d54);
        font-size: 13px;
        font-weight: 700;
      }
      .vtp-splash .vtp-nivel {
        animation: vtp-splash-encher 3.4s cubic-bezier(0.45, 0, 0.35, 1) infinite;
      }
      @keyframes vtp-splash-encher {
        0% {
          transform: translateY(136px);
        }
        68% {
          transform: translateY(30px);
        }
        86% {
          transform: translateY(26px);
        }
        100% {
          transform: translateY(136px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Desliga pelo NOME: só encurtar a duração faria a animação parar no
         último keyframe, que é o prato vazio. */
        .vtp-splash .vtp-nivel {
          animation-name: none;
          transform: translateY(52px);
        }
      }
    </style>
  </head>
  <body>
    <vtp-root>
      <div class="vtp-splash" role="status" aria-label="Carregando o Vitality PLUS">
        <svg width="132" height="132" viewBox="0 0 140 140" aria-hidden="true">
          <defs>
            <clipPath id="vtp-splash-louca"><circle cx="70" cy="70" r="50"></circle></clipPath>
          </defs>
          <circle cx="70" cy="70" r="50" fill="currentColor" opacity=".14"></circle>
          <g clip-path="url(#vtp-splash-louca)">
            <g class="vtp-nivel">
              <path
                d="M-60 0 C -45 -12 -15 -12 0 0 S 30 12 60 0 S 90 -12 120 0 S 150 12 180 0 L180 150 L-60 150 Z"
                fill="currentColor"
              ></path>
            </g>
          </g>
          <circle
            cx="70"
            cy="70"
            r="50"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            opacity=".4"
          ></circle>
          <circle
            cx="70"
            cy="70"
            r="62"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            opacity=".22"
          ></circle>
        </svg>
        <p class="vtp-splash__legenda">Servindo o seu dia…</p>
      </div>
    </vtp-root>
    <script>
      (function () {
        var english = document.documentElement.lang === 'en-US';
        var status = document.querySelector('.vtp-splash__legenda');
        var label = document.querySelector('.vtp-splash');
        if (status) status.textContent = english ? 'Serving your day…' : 'Servindo o seu dia…';
        if (label)
          label.setAttribute(
            'aria-label',
            english ? 'Loading Vitality PLUS' : 'Carregando o Vitality PLUS',
          );
      })();
    </script>
  </body>
</html>
