<bd-modal
  [open]="onboarding.welcomeOpen()"
  (openChange)="onOpenChange($event)"
  [title]="'onboarding.welcome.modalTitle' | transloco"
  [ariaLabel]="'onboarding.welcome.modalTitle' | transloco"
  [closeLabel]="'onboarding.welcome.close' | transloco"
>
  <section class="flex flex-col items-center gap-5 px-1 pb-1 pt-2 text-center sm:px-3">
    <span
      class="grid size-[72px] place-items-center rounded-[26px] bg-primary-soft text-primary-strong [box-shadow:0_0_0_8px_var(--bd-primary-soft)]"
      aria-hidden="true"
    >
      <svg width="42" height="42" viewBox="0 0 100 100" fill="none">
        <path
          d="M50 90 C18 66 6 45 6 28 C6 13 19 2 32 2 C43 2 49 11 50 18 C51 11 57 2 68 2 C81 2 94 13 94 28 C94 45 82 66 50 90 Z"
          fill="currentColor"
        />
        <path
          d="M10 46 L31 46 L39 29 L50 64 L59 38 L67 46 L90 46"
          stroke="var(--bd-accent)"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div class="max-w-[34ch]">
      <p class="m-0 text-[11px] font-extrabold uppercase tracking-[0.12em] text-primary-strong">
        {{ 'onboarding.welcome.eyebrow' | transloco }}
      </p>
      <h2 class="m-0 mt-2 text-[27px] font-extrabold tracking-tight text-fg sm:text-[30px]">
        {{ 'onboarding.welcome.title' | transloco }}
      </h2>
      <p class="m-0 mt-3 text-[14px] leading-6 text-fg-muted">
        {{ 'onboarding.welcome.description' | transloco }}
      </p>
    </div>

    <div
      class="grid w-full max-w-[360px] gap-2 rounded-[18px] border border-border bg-surface-hover/60 p-3 text-left"
    >
      <p class="m-0 text-[12.5px] font-semibold leading-5 text-fg-muted">
        {{ 'onboarding.welcome.guide' | transloco }}
      </p>
      <span class="flex items-center gap-2 text-[12px] font-bold text-primary-strong">
        <svg lucideCheck size="15" aria-hidden="true"></svg>
        {{ 'onboarding.welcome.guideDetail' | transloco }}
      </span>
    </div>

    <button bdButton block type="button" (click)="onboarding.beginIntroduction()">
      {{ 'onboarding.welcome.cta' | transloco }}
      <svg lucideArrowRight size="16" aria-hidden="true"></svg>
    </button>
  </section>
</bd-modal>
