<div class="shell">
  <aside class="sidebar" [class.open]="mobileMenuOpen()">
    <a routerLink="/dashboard" class="logo" (click)="closeMobileMenu()">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="11" stroke="var(--sidebar-accent)" stroke-width="1.6" opacity="0.5" />
        <path d="M13 6c2.5 2.5 2.5 6 0 8.5-2.5-2.5-2.5-6 0-8.5Z" fill="var(--bd-primary)" />
        <path d="M9 18l1.6-6M12 18l0.5-4M15 18l-1-5" stroke="var(--sidebar-accent)" stroke-width="1.4" stroke-linecap="round" />
      </svg>
      <span class="word">vitality<span>+</span></span>
    </a>
    <div class="grain" aria-hidden="true"></div>

    <nav aria-label="Navegação principal">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="closeMobileMenu()">
          <svg [lucideIcon]="item.icon" size="17" aria-hidden="true"></svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <a routerLink="/perfil" class="sidebar-foot" bdTooltip="Editar perfil" (click)="closeMobileMenu()">
      <bd-avatar [name]="auth.currentUser()?.name ?? '?'" [src]="auth.currentUser()?.avatar ?? ''" size="sm" />
      <span class="txt">
        <b>{{ auth.currentUser()?.name ?? 'Minha conta' }}</b>
        Ver perfil
      </span>
    </a>
  </aside>

  @if (mobileMenuOpen()) {
    <button class="scrim" aria-label="Fechar menu" (click)="closeMobileMenu()"></button>
  }

  <div class="main">
    <header class="topbar">
      <button
        class="menu-toggle"
        bdButton
        variant="ghost"
        size="sm"
        iconOnly
        aria-label="Abrir menu"
        (click)="toggleMobileMenu()"
      >
        <svg lucideMenu size="18" aria-hidden="true"></svg>
      </button>

      <div class="greeting">{{ saudacao() }}</div>

      <div class="top-actions">
        <div #paletteControl class="palette-control">
          <button
            bdButton
            variant="ghost"
            size="sm"
            iconOnly
            bdTooltip="Escolher paleta"
            aria-label="Escolher paleta"
            aria-haspopup="menu"
            [attr.aria-expanded]="paletaMenuAberto()"
            (click)="togglePaletaMenu()"
          >
            <svg lucidePalette size="16" aria-hidden="true"></svg>
          </button>

          @if (paletaMenuAberto()) {
            <vtp-palette-picker
              [paletas]="palette.paletas"
              [ativa]="palette.palette()"
              (escolher)="escolherPaleta($event)"
            />
          }
        </div>

        <button
          bdButton
          variant="ghost"
          size="sm"
          iconOnly
          [bdTooltip]="theme.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'"
          (click)="theme.toggle()"
        >
          @if (theme.theme() === 'dark') {
            <svg lucideSun size="16" aria-hidden="true"></svg>
          } @else {
            <svg lucideMoon size="16" aria-hidden="true"></svg>
          }
        </button>

        <a routerLink="/diario" class="cta">
          <svg lucidePlus size="15" aria-hidden="true"></svg>
          Registrar refeição
        </a>

        <button bdButton variant="ghost" size="sm" iconOnly bdTooltip="Sair" aria-label="Sair" (click)="logout()">
          <svg lucideLogOut size="16" aria-hidden="true"></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
