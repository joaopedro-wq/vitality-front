<bs-shell [labels]="shellLabels()" *transloco="let t">
  <a bsShellBrand routerLink="/dashboard" class="logo">
    <svg width="26" height="26" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path
        d="M50 90 C18 66 6 45 6 28 C6 13 19 2 32 2 C43 2 49 11 50 18 C51 11 57 2 68 2 C81 2 94 13 94 28 C94 45 82 66 50 90 Z"
        fill="var(--bd-primary)"
      />
      <path
        d="M10 46 L31 46 L39 29 L50 64 L59 38 L67 46 L90 46"
        stroke="var(--bs-sidebar-accent)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="word font-mono">vitality<span>+</span></span>
  </a>

  <div bsShellGreeting class="greeting">
    <span class="greeting-full">{{ saudacao() }}</span>
    <span class="greeting-compact">{{ saudacaoPeriodo() }}</span>
    <span class="greeting-mobile">{{ t('common.shell.hello') }}</span>
  </div>

  <vtp-language-selector bsShellTopActionsBefore />

  <div bsShellTopActions class="top-actions">
    <a
      routerLink="/diario"
      [queryParams]="{ registrar: 1 }"
      class="cta"
      data-tour="onboarding-register-meal"
      [bdTooltip]="t('common.shell.registerMeal')"
      placement="bottom"
      [attr.aria-label]="t('common.shell.registerMeal')"
    >
      <svg lucidePlus size="15" aria-hidden="true"></svg>
      <span class="cta-full">{{ t('common.shell.registerMeal') }}</span>
      <span class="cta-compact">{{ t('common.shell.register') }}</span>
    </a>

    <button
      bdButton
      variant="ghost"
      size="sm"
      iconOnly
      [bdTooltip]="t('common.actions.logout')"
      placement="bottom"
      [attr.aria-label]="t('common.actions.logout')"
      (click)="logout()"
    >
      <svg lucideLogOut size="16" aria-hidden="true"></svg>
    </button>
  </div>

  <a
    bsShellSidebarFooter
    routerLink="/perfil"
    class="sidebar-foot"
    [bdTooltip]="t('common.navigation.profile')"
  >
    <bd-avatar
      [name]="auth.currentUser()?.name ?? '?'"
      [src]="auth.currentUser()?.avatar ?? ''"
      size="sm"
    />
    <span class="txt">
      <b>{{ auth.currentUser()?.name ?? t('common.navigation.account') }}</b>
      {{ t('common.navigation.profile') }}
    </span>
  </a>

  <div bsShellOverlays>
    <vtp-confirm-dialog
      [aberto]="inactivity.warningOpen()"
      variante="soft"
      [dismissible]="false"
      [mostrarCancelar]="false"
      [titulo]="t('auth.sessionWarning.title')"
      [descricao]="t('auth.sessionWarning.description')"
      [confirmarTexto]="t('auth.sessionWarning.continue')"
      (confirmado)="inactivity.continueSession()"
    />
    <vtp-onboarding-welcome />
    <bd-tour [scrollIntoView]="true" [spotPadding]="10" />
  </div>
</bs-shell>
