<bd-modal [open]="true" (openChange)="onOpenChange($event)" [title]="titulo()" ariaLabel="Seu dia">
  <div class="flex flex-col items-center gap-4 text-center">
    @if (completo()) {
      <span
        class="grid size-16 place-items-center rounded-full bg-accent-soft text-accent [box-shadow:0_0_0_8px_var(--bd-accent-soft)]"
      >
        <svg lucideTrophy size="27" aria-hidden="true"></svg>
      </span>
    }

    <vtp-nutrition-reveal
      [totals]="totals()"
      [animar]="true"
      tamanho="lg"
      [label]="label()"
      labelCalculando="Somando seu dia…"
    />

    @if (meta(); as alvo) {
      <p class="text-[13px] text-fg-muted">
        <b class="text-fg tabular-nums">{{ totals().caloria | number: '1.0-0' }}</b> de
        <span class="tabular-nums">{{ alvo.meta_calorias | number: '1.0-0' }} kcal</span>
        @if (progresso(); as pct) {
          · <span class="tabular-nums">{{ pct }}%</span> da sua meta
        }
      </p>
    } @else {
      <p class="text-[13px] text-fg-muted">
        Sem meta definida ainda — os números acima são só o que você registrou hoje.
      </p>
    }

    <button
      class="rounded-full border border-border px-5 py-2 text-[13px] text-fg-muted transition-colors hover:border-border-strong hover:text-fg"
      type="button"
      (click)="fechar.emit()"
    >
      Voltar ao diário
    </button>
  </div>
</bd-modal>
