<div class="block" aria-hidden="true"></div>
<div class="auth-language"><vtp-language-selector /></div>

<div class="dots d1" aria-hidden="true">
  <div class="fruit">
    <span class="dot sun"></span>
    <span class="dot leaf sm"></span>
  </div>
</div>
<div class="dots d2" aria-hidden="true">
  <div class="fruit">
    <span class="dot mango lg"></span>
    <span class="dot sun sm"></span>
  </div>
</div>

<div class="stage">
  @if (badge()) {
    <div class="badge">{{ badge() }}</div>
  }
  <a routerLink="/" class="brand">
    <svg width="30" height="30" viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path
        d="M50 90 C18 66 6 45 6 28 C6 13 19 2 32 2 C43 2 49 11 50 18 C51 11 57 2 68 2 C81 2 94 13 94 28 C94 45 82 66 50 90 Z"
        fill="var(--bd-primary)"
      />
      <path
        d="M10 46 L31 46 L39 29 L50 64 L59 38 L67 46 L90 46"
        stroke="var(--bd-surface)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="brand-word font-mono">vitality<span>+</span></span>
  </a>
  <p class="eyebrow">{{ eyebrow() }}</p>

  <ng-content />
</div>
