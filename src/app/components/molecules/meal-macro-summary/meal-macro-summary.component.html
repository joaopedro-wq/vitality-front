<div
  class="flex flex-wrap items-baseline gap-x-3 gap-y-1"
  aria-label="Resumo nutricional da refeição"
>
  <strong class="whitespace-nowrap text-[17px] font-extrabold tabular-nums text-fg">
    {{ totals().caloria | number: '1.0-0' }}
    <span class="ml-0.5 text-[11px] font-bold uppercase tracking-wide text-fg-muted">kcal</span>
  </strong>
  <span
    class="flex flex-wrap items-center gap-x-2.5 gap-y-1 whitespace-nowrap text-[12px] font-bold tabular-nums text-fg-muted"
  >
    <span class="inline-flex items-center gap-1">
      <span class="size-2 rounded-full bg-primary" aria-hidden="true"></span>
      P {{ totals().proteina | number: '1.0-0' }} g
    </span>
    <span class="inline-flex items-center gap-1">
      <span class="size-2 rounded-full bg-accent" aria-hidden="true"></span>
      C {{ totals().carbo | number: '1.0-0' }} g
    </span>
    <span class="inline-flex items-center gap-1">
      <span class="size-2 rounded-full bg-fat" aria-hidden="true"></span>
      G {{ totals().gordura | number: '1.0-0' }} g
    </span>
  </span>
</div>
