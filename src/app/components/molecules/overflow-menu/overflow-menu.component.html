<div class="relative inline-block">
  <button
    class="grid size-[30px] place-items-center rounded-full border border-border text-fg-muted transition-colors hover:border-primary hover:text-primary-strong"
    type="button"
    aria-haspopup="menu"
    [attr.aria-expanded]="aberto()"
    [attr.aria-label]="rotulo()"
    (click)="alternar.emit()"
  >
    <svg lucideEllipsisVertical size="16" aria-hidden="true"></svg>
  </button>

  @if (aberto()) {
    <button
      class="fixed inset-0 z-[70] bg-black/35 md:hidden"
      type="button"
      aria-label="Fechar menu"
      (click)="fechar.emit()"
    ></button>

    <div
      class="fixed inset-x-0 bottom-0 z-[71] rounded-t-3xl border-t border-border bg-surface p-2 shadow-2xl animate-reveal md:absolute md:inset-x-auto md:bottom-auto md:right-0 md:top-full md:z-20 md:mt-2 md:w-64 md:rounded-2xl md:border md:p-1.5 md:shadow-xl"
      role="menu"
      [attr.aria-label]="rotulo()"
    >
      <ng-content />
    </div>
  }
</div>
