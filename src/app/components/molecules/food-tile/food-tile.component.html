<article
  class="relative flex cursor-pointer flex-col gap-2 rounded-xl border border-border bg-surface p-3 transition-colors hover:border-border-strong"
  [class.border-primary]="food().is_favorite"
  tabindex="0"
  role="button"
  [attr.aria-label]="food().descricao"
  (click)="tileClick.emit(food())"
  (keydown.enter)="tileClick.emit(food())"
>
  @if (food().is_favorite) {
    <span
      class="absolute right-2.5 top-0 inline-flex items-center gap-1 rounded-b-md bg-primary px-1.5 py-[3px] text-[8.5px] font-extrabold uppercase tracking-wide text-primary-contrast"
    >
      <svg lucideHeart size="9" fill="currentColor" aria-hidden="true"></svg>
      Favorito
    </span>
  } @else {
    <button
      type="button"
      class="absolute right-1.5 top-1.5 grid size-6 place-items-center rounded-full text-fg-subtle hover:bg-surface-hover hover:text-danger"
      aria-label="Favoritar"
      (click)="onFavorite($event)"
    >
      <svg lucideHeart size="14" aria-hidden="true"></svg>
    </button>
  }

  <div class="flex items-center gap-2.5" [class.pt-2]="food().is_favorite">
    <div class="size-9 flex-none rounded-full" [style.background]="ringGradient()"></div>
    <p class="m-0 min-h-[2.4em] text-[11.5px] font-bold leading-[1.3] text-fg">
      {{ food().descricao }}
    </p>
  </div>

  <div class="text-[13.5px] font-extrabold text-primary-strong">
    {{ food().caloria | number: '1.0-0' }}
    <small class="text-[9px] font-bold text-fg-muted"
      >kcal/{{ food().qtd | number: '1.0-0' }}g</small
    >
  </div>

  <div class="flex flex-wrap gap-2 border-t border-border pt-1.5">
    <span class="inline-flex items-center gap-1 text-[10px] font-bold text-fg-muted">
      <i class="size-1.5 rounded-full bg-primary"></i>{{ food().proteina | number: '1.0-1' }}g
    </span>
    <span class="inline-flex items-center gap-1 text-[10px] font-bold text-fg-muted">
      <i class="size-1.5 rounded-full bg-accent"></i>{{ food().carbo | number: '1.0-1' }}g
    </span>
    <span class="inline-flex items-center gap-1 text-[10px] font-bold text-fg-muted">
      <i class="size-1.5 rounded-full bg-fat"></i>{{ food().gordura | number: '1.0-1' }}g
    </span>
  </div>
</article>
