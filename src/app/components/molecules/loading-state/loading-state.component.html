<div
  class="flex flex-col items-center gap-4 text-center animate-reveal"
  [class.py-7]="tamanho() === 'sm'"
  [class.py-14]="tamanho() !== 'sm'"
>
  <vtp-plate-loader [tamanho]="tamanho()" />

  <div class="flex flex-col gap-1">
    <p class="m-0 text-[14px] font-bold text-fg">{{ titulo() }}</p>
    @if (descricao(); as texto) {
      <p class="m-0 max-w-[42ch] text-[12.5px] text-fg-muted">{{ texto }}</p>
    }
  </div>
</div>
