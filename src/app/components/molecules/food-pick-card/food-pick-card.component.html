<button
  class="relative flex w-full flex-col gap-1.5 rounded-[13px] border bg-surface p-2.5 text-left transition-[transform,border-color,box-shadow] duration-200 ease-[cubic-bezier(0.34,1.56,0.64,1)] hover:-translate-y-0.5 hover:border-primary"
  [class]="
    selecionado()
      ? 'border-primary [box-shadow:0_0_0_3px_var(--bd-primary-soft)]'
      : 'border-border'
  "
  type="button"
  [attr.aria-pressed]="selecionado()"
  (click)="pick.emit(food())"
>
  @if (selecionado()) {
    <span
      class="absolute right-2 top-2 grid size-[18px] place-items-center rounded-full bg-primary text-primary-contrast"
    >
      <svg lucideCheck size="11" aria-hidden="true"></svg>
    </span>
  }

  <span class="flex items-center gap-2">
    <span class="grid size-[26px] flex-none place-items-center overflow-hidden rounded-lg bg-primary-soft">
      <vtp-food-illustration [illustrationKey]="food().illustration_key" />
    </span>
    <span class="min-w-0">
      <b class="block text-[12.5px] font-semibold leading-tight">{{ food().descricao }}</b>
      <small class="text-[11px] tabular-nums text-fg-muted">
        {{ food().caloria | number: '1.0-0' }} kcal / {{ food().qtd | number: '1.0-0' }} g
      </small>
    </span>
  </span>

  <span
    class="flex h-[5px] overflow-hidden rounded-full bg-surface-hover"
    aria-hidden="true"
  >
    <i class="block h-full bg-primary" [style.width.%]="proporcao().proteina"></i>
    <i class="block h-full bg-accent" [style.width.%]="proporcao().carbo"></i>
    <i
      class="block h-full"
      style="background-color: var(--fat)"
      [style.width.%]="proporcao().gordura"
    ></i>
  </span>
</button>
