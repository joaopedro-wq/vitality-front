<nav class="track" aria-label="Jornada de refeições do dia">
  @for (checkpoint of checkpoints(); track checkpoint.meal.id; let last = $last) {
    <button
      type="button"
      class="checkpoint"
      [class.is-done]="checkpoint.status === 'concluido'"
      [class.is-current]="checkpoint.status === 'atual'"
      [attr.aria-label]="
        checkpoint.meal.descricao + (checkpoint.entries ? ', registrada' : ', em aberto')
      "
      (click)="choose.emit(checkpoint.meal)"
    >
      <span class="checkpoint__dot" aria-hidden="true">
        @if (checkpoint.status === 'concluido') {
          <svg lucideCheck size="14"></svg>
        } @else {
          <svg lucideCircle size="10"></svg>
        }
      </span>
      <span class="checkpoint__copy">
        <b>{{ checkpoint.meal.descricao }}</b>
        <small>
          {{
            checkpoint.status === 'concluido'
              ? checkpoint.entries + (checkpoint.entries === 1 ? ' lançamento' : ' lançamentos')
              : checkpoint.status === 'atual'
                ? 'Próximo passo'
                : checkpoint.meal.horario
          }}
        </small>
      </span>
    </button>
    @if (!last) {
      <span
        class="track__line"
        [class.is-done]="checkpoint.status === 'concluido'"
        aria-hidden="true"
      ></span>
    }
  }
</nav>
