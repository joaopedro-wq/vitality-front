<div class="card-footer">
  @if (mostrarVoltar()) {
    <button class="round-back" type="button" [attr.aria-label]="backLabel()" (click)="voltar.emit()">
      <svg lucideArrowLeft size="15" aria-hidden="true"></svg>
    </button>
  } @else {
    <span></span>
  }

  <button
    class="round-next"
    type="button"
    [class.done]="ultimo()"
    [attr.aria-label]="ultimo() ? saveLabel() : continueLabel()"
    [attr.aria-busy]="carregando() ? true : null"
    [disabled]="carregando() || desabilitado()"
    (click)="avancar.emit()"
  >
    @if (carregando()) {
      <!-- `cor="herdada"`: o fundo do botão já é --bd-primary. -->
      <vtp-plate-loader tamanho="xs" cor="herdada" />
    } @else if (ultimo()) {
      <svg lucideSave size="16" aria-hidden="true"></svg>
    } @else {
      <svg lucideArrowRight size="16" aria-hidden="true"></svg>
    }
  </button>
</div>
