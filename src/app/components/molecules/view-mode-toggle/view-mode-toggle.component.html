<div class="inline-flex items-center gap-0.5 rounded-full border border-border bg-surface p-[3px]">
  @for (opt of options(); track opt.value) {
    <button
      type="button"
      class="inline-flex size-8 items-center justify-center rounded-full transition-colors"
      [class]="
        opt.value === value() ? 'bg-primary text-primary-contrast' : 'text-fg-muted hover:text-fg'
      "
      [attr.aria-pressed]="opt.value === value()"
      [attr.aria-label]="opt.label"
      [attr.title]="opt.label"
      (click)="valueChange.emit(opt.value)"
    >
      <svg [lucideIcon]="opt.icon" size="15" aria-hidden="true"></svg>
    </button>
  }
</div>
