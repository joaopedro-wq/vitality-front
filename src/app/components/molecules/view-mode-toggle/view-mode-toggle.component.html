<div class="inline-flex items-center gap-0.5 rounded-full border border-border bg-surface p-[3px]">
  @for (opt of options(); track opt.value) {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[11.5px] font-bold transition-colors"
      [class]="
        opt.value === value() ? 'bg-primary text-primary-contrast' : 'text-fg-muted hover:text-fg'
      "
      [attr.aria-pressed]="opt.value === value()"
      (click)="valueChange.emit(opt.value)"
    >
      <svg [lucideIcon]="opt.icon" size="13" aria-hidden="true"></svg>
      {{ opt.label }}
    </button>
  }
</div>
