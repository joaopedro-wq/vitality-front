<div
  class="mt-4 flex items-center gap-2 rounded-xl border border-border bg-surface px-3 text-fg-muted focus-within:border-primary focus-within:[box-shadow:var(--bd-focus-ring)]"
>
  <svg lucideSearch size="16" aria-hidden="true"></svg>
  <input
    class="block min-w-0 flex-1 border-0 bg-transparent py-2.5 text-left text-sm text-fg outline-none placeholder:text-fg-subtle"
    [value]="busca()"
    [placeholder]="'dietPlan.searchFoodPlaceholder' | transloco"
    [attr.aria-label]="label() || null"
    (input)="buscar($any($event.target).value)"
  />
</div>
<p class="m-0 mt-1.5 text-left text-xs leading-relaxed text-fg-muted">
  {{ 'dietPlan.foodSearchHint' | transloco }}
</p>
@if (resultados().length) {
  <div
    class="mt-2 w-full overflow-hidden rounded-xl border border-border bg-surface text-left shadow-sm"
  >
    @for (food of resultados(); track food.id) {
      <button
        class="block w-full border-0 bg-transparent px-3 py-2.5 text-left text-sm font-semibold text-fg hover:bg-primary-soft"
        type="button"
        (click)="adicionar(food)"
      >
        <span class="block">{{ food.descricao }}</span>
        @if (food.detalhe_exibicao) {
          <span class="mt-0.5 block text-xs font-medium leading-snug text-fg-muted">{{
            food.detalhe_exibicao
          }}</span>
        }
      </button>
    }
  </div>
}
@if (selecionados().length) {
  <div class="mt-3 flex flex-wrap gap-2">
    @for (food of selecionados(); track food.id) {
      <button
        class="inline-flex min-h-8 items-center gap-1 rounded-full border border-border bg-surface px-3 text-[12px] font-bold text-fg transition-colors hover:border-primary hover:bg-primary-soft hover:text-primary-strong"
        type="button"
        (click)="remover(food.id)"
      >
        {{ descricaoCompleta(food) }}
        <svg lucideX size="14" aria-hidden="true"></svg>
      </button>
    }
  </div>
}
