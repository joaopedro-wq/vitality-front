<div class="flex flex-col gap-6">
  <div>
    <p class="m-0 text-[11px] font-extrabold uppercase tracking-[0.1em] text-primary-strong">
      {{ 'profileLabels.stage' | transloco }} 1
    </p>
    <h2 class="m-0 mt-1 text-[20px] tracking-[-0.02em]">
      {{ 'profileLabels.identity' | transloco }}
    </h2>
    <p class="m-0 mt-2 text-[13px] leading-[1.55] text-fg-muted">
      Vamos começar pelos dados que identificam o seu perfil.
    </p>
  </div>

  @if (user(); as currentUser) {
    <vtp-profile-photo-card
      [name]="currentUser.name"
      [email]="currentUser.email"
      [src]="avatarSrc()"
      [progresso]="progresso()"
      [selectedFileName]="avatarSelecionado()?.name ?? null"
      [removendo]="removendoAvatar()"
      (escolher)="selecionarAvatar($event)"
      (cancelar)="cancelarAvatarSelecionado()"
      (remover)="removerAvatar()"
    />
  }

  <form [formGroup]="form" class="grid gap-5 sm:grid-cols-2" (ngSubmit)="avancar()">
    <div class="sm:col-span-2">
      <bd-field
        label="Nome"
        required
        hint="Usamos este nome para personalizar sua experiência."
        [error]="
          form.controls.name.touched && form.controls.name.invalid ? 'Informe seu nome.' : ''
        "
      >
        <input bdInput type="text" formControlName="name" autocomplete="name" />
      </bd-field>
    </div>
    <div class="sm:col-span-2">
      <bd-field
        label="E-mail"
        required
        hint="Seu acesso e comunicações importantes usam este endereço."
        [error]="
          form.controls.email.touched && form.controls.email.invalid
            ? 'Informe um e-mail válido.'
            : ''
        "
      >
        <input bdInput type="email" formControlName="email" autocomplete="email" />
      </bd-field>
    </div>
    <bd-field
      label="Data de nascimento"
      required
      hint="Ela ajuda a calcular suas recomendações."
      [error]="
        form.controls.data_nascimento.touched && form.controls.data_nascimento.invalid
          ? 'Informe sua data de nascimento.'
          : ''
      "
    >
      <input bdInput type="date" formControlName="data_nascimento" autocomplete="bday" />
    </bd-field>
    <div>
      <p class="m-0 mb-2 text-[10px] font-extrabold uppercase tracking-wide text-fg-subtle">
        Gênero
      </p>
      <div class="flex flex-wrap gap-2">
        @for (opt of generoOptions; track opt.value) {
          <label
            class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border px-3.5 py-2 text-[12.5px] font-bold transition-[box-shadow,border-color,background-color,transform] duration-150 ease-[cubic-bezier(0.34,1.56,0.64,1)] active:scale-95"
            [class]="
              form.controls.genero.value === opt.value
                ? 'border-primary bg-primary-soft text-primary-strong scale-[1.03] [box-shadow:0_0_0_2px_var(--bd-primary-soft)]'
                : 'border-border bg-surface text-fg hover:border-border-strong'
            "
          >
            <input class="sr-only" type="radio" formControlName="genero" [value]="opt.value" />
            <svg [lucideIcon]="opt.icone" size="14" aria-hidden="true"></svg>
            {{ opt.label }}
          </label>
        }
      </div>
    </div>
  </form>

  <vtp-step-footer [mostrarVoltar]="false" [carregando]="salvando()" (avancar)="avancar()" />
</div>
