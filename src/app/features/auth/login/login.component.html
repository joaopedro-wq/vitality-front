<vtp-auth-poster-layout [attr.lang]="language.locale()">
  <vtp-page-title
    [titulo]="'auth.loginTitle' | transloco"
    [subtitulo]="'auth.loginSubtitle' | transloco"
    variante="autenticacao"
  />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (generalError()) {
      <bd-alert tone="danger" [title]="generalError()!" />
    }

    <bd-field
      [label]="'auth.email' | transloco"
      required
      [error]="
        emailError() ??
        (form.controls.email.touched && form.controls.email.invalid
          ? ('auth.invalidEmail' | transloco)
          : '')
      "
    >
      <input
        bdInput
        type="email"
        formControlName="email"
        autocomplete="email"
        [placeholder]="'auth.emailPlaceholder' | transloco"
      />
    </bd-field>

    <bd-field
      [label]="'auth.password' | transloco"
      required
      [error]="
        passwordError() ??
        (form.controls.password.touched && form.controls.password.invalid
          ? ('auth.requiredPassword' | transloco)
          : '')
      "
    >
      <div class="password-control">
        <input
          bdInput
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <button
          class="password-toggle"
          type="button"
          [attr.aria-label]="
            (passwordVisible() ? 'auth.hidePassword' : 'auth.showPassword') | transloco
          "
          [attr.aria-pressed]="passwordVisible()"
          (click)="togglePasswordVisibility()"
        >
          @if (passwordVisible()) {
            <svg lucideEyeOff size="18" aria-hidden="true"></svg>
          } @else {
            <svg lucideEye size="18" aria-hidden="true"></svg>
          }
        </button>
      </div>
    </bd-field>

    <button
      bdButton
      type="submit"
      block
      [disabled]="status() === 'sending'"
      [attr.aria-busy]="status() === 'sending' ? true : null"
    >
      @if (status() === 'sending') {
        <vtp-plate-loader tamanho="xs" cor="herdada" />
      }
      {{ 'auth.login' | transloco }}
    </button>
  </form>

  <p class="switch-line">
    {{ 'auth.noAccount' | transloco }}
    <a routerLink="/register">{{ 'auth.createAccount' | transloco }}</a>
  </p>
</vtp-auth-poster-layout>
