<div *transloco="let t">
  <vtp-auth-poster-layout [badge]="t('auth.loginBadge')">
    <vtp-page-title
      [titulo]="t('auth.loginTitle')"
      [subtitulo]="t('auth.loginSubtitle')"
      variante="autenticacao"
    />

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (generalError()) {
        <bd-alert tone="danger" [title]="generalError()!" />
      }

      <bd-field
        [label]="t('auth.email')"
        required
        [error]="
          emailError() ??
          (form.controls.email.touched && form.controls.email.invalid ? t('auth.invalidEmail') : '')
        "
      >
        <input
          bdInput
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="t('auth.emailPlaceholder')"
        />
      </bd-field>

      <bd-field
        [label]="t('auth.password')"
        required
        [error]="
          passwordError() ??
          (form.controls.password.touched && form.controls.password.invalid
            ? t('auth.requiredPassword')
            : '')
        "
      >
        <input
          bdInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </bd-field>

      <button
        bdButton
        type="submit"
        block
        [disabled]="status() === 'sending'"
        [attr.aria-busy]="status() === 'sending' ? true : null"
      >
        @if (status() === 'sending') {
          <vtp-plate-loader tamanho="xs" cor="herdada" />
        }
        {{ t('auth.login') }}
      </button>
    </form>

    <p class="switch-line">
      {{ t('auth.noAccount') }}
      <a routerLink="/register">{{ t('auth.createAccount') }}</a>
    </p>
  </vtp-auth-poster-layout>
</div>
