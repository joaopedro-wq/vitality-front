<vtp-auth-poster-layout badge="68% batem a meta">
  <div class="heading">
    <h1>Volta pra roda</h1>
    <p>Sua meta de hoje está esperando. Entra e registra a primeira refeição.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (generalError()) {
      <bd-alert tone="danger" [title]="generalError()!" />
    }

    <bd-field
      label="E-mail"
      required
      [error]="
        emailError() ??
        (form.controls.email.touched && form.controls.email.invalid ? 'Informe um e-mail válido.' : '')
      "
    >
      <input bdInput type="email" formControlName="email" autocomplete="email" placeholder="voce@exemplo.com" />
    </bd-field>

    <bd-field
      label="Senha"
      required
      [error]="
        passwordError() ??
        (form.controls.password.touched && form.controls.password.invalid ? 'Informe sua senha.' : '')
      "
    >
      <input bdInput type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
    </bd-field>

    <button bdButton type="submit" block [loading]="status() === 'sending'">Entrar</button>
  </form>

  <p class="switch-line">
    Ainda não tem conta?
    <a routerLink="/register">Criar conta</a>
  </p>
</vtp-auth-poster-layout>
