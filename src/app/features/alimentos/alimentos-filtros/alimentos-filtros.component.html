<aside class="card flex flex-col gap-6 p-5">
  <div class="flex items-center justify-between">
    <p class="m-0 text-[13px] font-bold text-fg">{{ 'ui2.foodFilters.title' | transloco }}</p>
    @if (temFiltroAtivo()) {
      <button
        type="button"
        class="inline-flex items-center gap-1 text-[11px] font-bold text-fg-subtle underline decoration-dotted underline-offset-2 hover:text-fg"
        (click)="limpar.emit()"
      >
        <svg lucideX size="12" aria-hidden="true"></svg>
        {{ 'ui2.actions.clear' | transloco }}
      </button>
    }
  </div>

  @if (mostrarBusca()) {
    <label class="filter-search">
      <svg lucideSearch size="16" aria-hidden="true"></svg>
      <input
        #termo
        type="search"
        [placeholder]="'ui2.foodFilters.search' | transloco"
        [value]="busca()"
        (input)="buscaChange.emit(termo.value)"
      />
    </label>
  }

  @if (mostrarFavoritos()) {
    <section class="favorite-filter">
      <div>
        <p>{{ 'ui2.foodFilters.favorites' | transloco }}</p>
        <span>{{ 'ui2.foodFilters.onlySaved' | transloco }}</span>
      </div>
      <bd-switch
        [checked]="somenteFavoritos()"
        (checkedChange)="somenteFavoritosChange.emit($event)"
      >
        <span class="sr-only">{{ 'ui2.foodFilters.onlyFavorites' | transloco }}</span>
      </bd-switch>
    </section>
  }

  <vtp-facet-checkbox-list
    [label]="'ui2.foodFilters.group' | transloco"
    [options]="opcoesGrupo()"
    [selected]="grupoSelecionado()"
    [loading]="grupoLoading()"
    (selectedChange)="grupoSelecionadoChange.emit($event)"
  />

  <vtp-range-slider
    [label]="'ui2.foodFilters.caloriesPerServing' | transloco"
    [min]="caloriaBounds()[0]"
    [max]="caloriaBounds()[1]"
    [step]="10"
    [value]="caloriaRange()"
    [formatValue]="formatKcal"
    (valueChange)="caloriaRangeChange.emit($event)"
  />
</aside>
