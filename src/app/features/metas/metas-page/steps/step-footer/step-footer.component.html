<div class="card-footer">
  @if (mostrarVoltar()) {
    <button class="back-link" type="button" (click)="voltar.emit()">← Voltar</button>
  } @else {
    <span></span>
  }

  <button
    class="round-next"
    type="button"
    [class.done]="ultimo()"
    [attr.aria-label]="ultimo() ? 'Salvar' : 'Continuar'"
    [disabled]="carregando()"
    (click)="avancar.emit()"
  >
    @if (carregando()) {
      <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9" /></svg>
    } @else if (ultimo()) {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
    }
  </button>
</div>
