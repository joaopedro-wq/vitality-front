@if (loadingVisivel()) {
  <vtp-loading-state
    [titulo]="'dietPlan.loadingTitle' | transloco"
    [descricao]="'dietPlan.loadingHint' | transloco"
  />
} @else if (mode() === 'form') {
  <vtp-back-button class="page-shell-wide" fallbackRota="/dietas" />
  <section class="page-shell-wide">
    <header class="border-b border-border pb-6">
      <vtp-page-title
        [contexto]="'dietPlan.newPlanContext' | transloco"
        [titulo]="'dietPlan.dayQuestionTitle' | transloco"
        [subtitulo]="
          'dietPlan.calorieReference'
            | transloco: { calories: meta()!.meta_calorias | number: '1.0-0' }
        "
      />
    </header>

    <div class="page-shell mt-4 card p-4 sm:p-6 lg:p-8">
      <vtp-step-track
        class="mt-7 block"
        [steps]="passosForm()"
        [ativo]="passo()"
        orientacao="horizontal"
        [label]="'dietPlan.stepsLabel' | transloco"
        (stepClick)="irParaPasso($event)"
      />

      <div class="mt-6">
        @switch (passo()) {
          @case (0) {
            <vtp-refeicoes-step
              [valorInicial]="mealCount()"
              (concluido)="onRefeicoesConcluido($event)"
            />
          }
          @case (1) {
            <vtp-estilo-step
              [valorInicial]="style()"
              (voltar)="irParaPasso(0)"
              (concluido)="onEstiloConcluido($event)"
            />
          }
          @case (2) {
            <vtp-preferencias-step
              [excluidosIniciais]="excluded()"
              [incluidosIniciais]="included()"
              [mealCount]="mealCount()"
              [dietTypeInicial]="dietType()"
              [restrictionOptions]="restrictionOptions()"
              [dietOptions]="dietOptions()"
              [feasibility]="feasibility()"
              [checkingFeasibility]="checkingFeasibility()"
              (voltar)="irParaPasso(1)"
              (criteriaChange)="onPreferenceCriteriaChange($event)"
              (concluido)="onPreferenciasConcluido($event)"
            />
          }
          @case (3) {
            <vtp-revisar-step
              [mealCount]="mealCount()"
              [style]="style()"
              [dietType]="dietType()"
              [restrictions]="selectedRestrictions()"
              [excluded]="excluded()"
              [included]="included()"
              [gerando]="generating()"
              (voltar)="irParaPasso(2)"
              (gerar)="generate()"
            />
          }
        }
      </div>
    </div>
  </section>
} @else if (draft(); as plan) {
  <section class="page-shell-wide card p-4 sm:p-6 lg:p-8">
    <header class="border-b border-border pb-6">
      <vtp-page-title
        [contexto]="'dietPlan.previewContext' | transloco"
        [titulo]="'dietPlan.previewTitle' | transloco"
      />
    </header>

    <vtp-meal-plan-preview
      [draft]="plan"
      [editando]="editando()"
      [saving]="saving()"
      [dirty]="dirty()"
      [titulo]="title()"
      [regeneratingMeal]="regeneratingMeal()"
      [suggesting]="suggesting()"
      [applyingChange]="applyingChange()"
      [suggestions]="suggestions()"
      [swapFailureMessage]="swapFailureMessage()"
      [swapTarget]="swapTarget()"
      (tituloChange)="onTituloChange($event)"
      (save)="save()"
      (ajustarPreferencias)="mode.set('form')"
      (regenerateMeal)="regenerateMeal($event)"
      (openItemSwap)="openItemSwap($event)"
      (closeSwap)="closeSwap()"
      (loadSuggestions)="loadSuggestions()"
      (applySuggestion)="applySuggestion($event)"
      (useMealFromDrawer)="useMealFromDrawer($event)"
    />
  </section>
}

<vtp-loading-overlay
  [ativo]="generating()"
  [titulo]="'uiLoading.buildingPlan' | transloco"
  [mensagens]="mensagensGeracao()"
/>
