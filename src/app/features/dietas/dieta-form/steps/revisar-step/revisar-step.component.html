<p class="m-0 text-[11px] font-extrabold uppercase tracking-[0.1em] text-primary-strong">
  Passo 4 de 4
</p>
<h2 class="m-0 mt-1.5 text-xl font-bold tracking-tight">Confere antes de gerar</h2>
<p class="m-0 mt-2 text-sm leading-relaxed text-fg-muted">
  Pode voltar em qualquer pergunta pela trilha acima.
</p>
<div class="mx-auto mt-6 grid w-full max-w-[420px] gap-2.5 text-left">
  <div
    class="flex items-center justify-between border-b border-dashed border-border-strong pb-2.5 text-sm"
  >
    <span class="text-fg-muted">Refeições</span>
    <strong>{{ mealCount() }} por dia</strong>
  </div>
  <div
    class="flex items-center justify-between border-b border-dashed border-border-strong pb-2.5 text-sm"
  >
    <span class="text-fg-muted">Estilo</span>
    <strong>{{ formatStyle(style()) }}</strong>
  </div>
  <div class="flex items-center justify-between text-sm">
    <span class="text-fg-muted">Evitando</span>
    <strong>{{
      excluded().length
        ? excluded().length + (excluded().length === 1 ? ' item' : ' itens')
        : 'Nada'
    }}</strong>
  </div>
</div>

<vtp-step-footer
  [ultimo]="true"
  [carregando]="gerando()"
  (voltar)="voltar.emit()"
  (avancar)="gerar.emit()"
/>
