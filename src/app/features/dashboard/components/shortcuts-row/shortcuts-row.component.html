<div
  class="relative mx-auto w-full max-w-[310px] md:hidden"
  [style.aspect-ratio]="trilhaGrade.proporcao"
>
  <svg
    class="absolute inset-0 h-full w-full"
    [attr.viewBox]="trilhaGrade.viewBox"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    @for (segmento of trilhaGrade.segmentos; track $index) {
      <path
        [attr.d]="segmento"
        fill="none"
        stroke="var(--bd-border-strong)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="2 12"
      />
    }
  </svg>

  @for (atalho of atalhos(); track atalho.path; let i = $index) {
    <a
      [routerLink]="atalho.path"
      class="absolute flex w-[132px] -translate-x-1/2 -translate-y-[26px] flex-col items-center no-underline"
      [style.left.%]="trilhaGrade.nodes[i].x"
      [style.top.%]="trilhaGrade.nodes[i].y"
      [attr.aria-label]="atalho.nome + ' — ' + atalho.status"
    >
      <vtp-shortcut-trail-node
        [icone]="atalho.icone"
        [label]="atalho.nome"
        [status]="atalho.status"
        [progresso]="atalho.progresso"
        [corVar]="atalho.corVar"
        [ativo]="atalho.ativo"
      />
    </a>
  }
</div>

<!-- Desktop (≥ md): fileira única. -->
