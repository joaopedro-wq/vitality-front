<vtp-macro-summary
  [valores]="valoresMacro()"
  [progresso]="progressoFracao()"
  tamanho="lg"
  orientacao="col"
>
  <span class="text-[10.5px] font-bold uppercase tracking-wide text-fg-muted">{{
    'dashboard.badgeCard.xpLabel' | transloco
  }}</span>
</vtp-macro-summary>

<div class="flex w-full max-w-[220px] flex-col items-center gap-1.5">
  <span
    class="inline-flex items-center gap-1.5 rounded-full bg-accent-soft px-3 py-1.5 text-[11.5px] font-bold text-accent"
  >
    {{ 'dashboard.badgeCard.level' | transloco: { level: progressao().nivel } }}
  </span>
  <div class="h-1.5 w-full overflow-hidden rounded-full bg-border">
    <span
      class="block h-full rounded-full bg-accent transition-[width] duration-700 ease-out"
      [style.width.%]="progressao().progresso_percent"
    ></span>
  </div>
  <span class="text-[10.5px] text-fg-muted">{{
    'dashboard.badgeCard.xpToNext'
      | transloco: { xp: progressao().xp, next: progressao().xp_proximo_nivel }
  }}</span>
</div>
